name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install project and dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run fast test suite
        run: pytest -m "not slow"
      - name: Upload coverage report
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  package:
    runs-on: ubuntu-latest
    needs: fast-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install build tooling
        run: python -m pip install '.[dev]'
      - name: Build distributions
        run: python -m build
      - name: Check built distributions
        run: python -m twine check dist/*
      - name: Assert wheel excludes tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel_path = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel_path) as wheel:
              assert not any(name.startswith("tests/") for name in wheel.namelist())
          PY
      - name: Verify built wheel
        shell: bash
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install --upgrade pip
          wheel-test/bin/python -m pip install dist/*.whl
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          "$GITHUB_WORKSPACE/wheel-test/bin/python" -c "import trussme; print(trussme.__version__)"

  slow-tests:
    runs-on: ubuntu-latest
    needs: fast-tests
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install project and dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run slow test suite
        run: pytest -m "slow" --no-cov
